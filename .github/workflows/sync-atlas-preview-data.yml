name: Sync reviewed Atlas player database
on:
  push:
    branches:
      - finish/nba-atlas-final-review-20261029
    paths:
      - .github/workflows/sync-atlas-preview-data.yml
permissions:
  contents: write
jobs:
  sync-atlas-database:
    if: github.ref == 'refs/heads/finish/nba-atlas-final-review-20261029'
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
      - name: Download the tested preview dataset
        run: curl --fail --location --retry 3 --max-time 90 https://sb-57p7b73s4zwe.vercel.run/players.json --output nba-all-time-atlas/players.json
      - name: Validate database before writing
        run: |
          node <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('nba-all-time-atlas/players.json', 'utf8'));
          const players = d.players || [];
          const drafts = players.reduce((n, p) => n + (p.draftEntries || []).length, 0);
          if (players.length !== 5419 || drafts !== 13089) {
            throw new Error('Unexpected Atlas database: ' + players.length + ' players / ' + drafts + ' draft entries');
          }
          console.log('Validated ' + players.length + ' players and ' + drafts + ' historical draft entries.');
          NODE
      - name: Commit validated database to this review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba-all-time-atlas/players.json
          if git diff --cached --quiet; then
            echo "The data file is already current."
          else
            git commit -m "Sync full Atlas historical draft database"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
