<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>COURTSIDE 27</title></head><body>
<script>
(async()=>{
const P=['g00.txt','g01.txt','g02.txt','g03.txt','g04.txt'];
const B=await Promise.all(P.map(p=>fetch(p).then(r=>{if(!r.ok)throw new Error(p);return r.arrayBuffer()})));
const T=B.reduce((n,b)=>n+b.byteLength,0),C=new Uint8Array(T);
let o=0;for(const b of B){C.set(new Uint8Array(b),o);o+=b.byteLength}
document.open();document.write(new TextDecoder().decode(C));document.close();
})().catch(e=>{document.body.innerHTML='<p style="color:#fff;font-family:sans-serif;padding:40px">Failed to load game: '+e.message+'</p>'});
</script>
</body></html>
